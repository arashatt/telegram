<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Instagram automation intake</title>
  <desc>The project's own chat mark on the Instagram gradient. A camera-glyph
  variant is in favicon-instagram-camera.svg; it reads as Instagram's own app
  icon in a tab, which is why it is not the default.</desc>
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcaf45"/>
      <stop offset="0.48" stop-color="#e1306c"/>
      <stop offset="1" stop-color="#833ab4"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#ig)"/>
  <g transform="translate(6.1,5.8) scale(0.62)">
    <path d="M6 4h20a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H15l-6 5v-5H6a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4Z" fill="#ffffff"/>
    <circle cx="10.5" cy="14" r="2.1" fill="#e1306c"/>
    <circle cx="16" cy="14" r="2.1" fill="#e1306c"/>
    <circle cx="21.5" cy="14" r="2.1" fill="#e1306c"/>
  </g>
</svg>
